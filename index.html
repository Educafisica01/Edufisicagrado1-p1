  --cuerpo: #6A3FB5;
  --mueve: #1F7A4D;
  --agua: #2A78C8;

}

    --line: #2C3557; --gold: #F4B942; --gold-ink: #1B2340; --cuerpo: #B79BF0; --mueve: #46B07D; --agua: #6DB2F2;

}

  --soft: #202949; --on-zone: #0F1426; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; padding-inline: 0; }
h1, h2, h3, h4 { font-family: var(--display); color: var(--navy); margin: 0; text-wrap: balance; line-height: 1.12; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: 16px; }

.topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 10px; }

.logo { width: 44px; height: 44px; border-radius: 12px; background: var(--navy); color: var(--bg); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; }
.brand strong { display: block; font-family: var(--display); font-size: 19px; color: var(--navy); line-height: 1.1; }

.badge { display: flex; align-items: center; min-height: 40px; padding-inline: 16px; border-radius: 999px; background: var(--navy); color: var(--bg); font-size: 14px; font-weight: 800; }

.body-art { background: var(--surface); border: 2px solid var(--line); border-radius: 28px; padding: 20px; margin: 0; }
.body-art svg { width: 100%; height: auto; display: block; }
.body-art figcaption { margin-top: 10px; font-size: 14px; color: var(--muted); }

.section { padding-block: 32px; }

.section > .wrap > .lead { margin-bottom: 24px; max-width: 640px; }

.zone-head h3 { font-size: 24px; }
.zone-tag { padding: 5px 14px; border-radius: 999px; background: var(--zc); color: var(--on-zone); font-size: 13px; font-weight: 800; letter-spacing: .06em; }

.num { width: 40px; height: 40px; border-radius: 50%; background: var(--zc); color: var(--on-zone); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; flex: none; }
.kind { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
.week h4 { font-size: 21px; }

.go { font-weight: 800; color: var(--zc); font-size: 15px; }


.passport { background: var(--surface); border: 2px solid var(--line); border-radius: 26px; padding: 24px; }

.note-small { margin-top: 16px; font-size: 14.5px; color: var(--muted); }

.families { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.fam { padding: 22px; background: var(--soft); border-radius: 22px; }

.week-hero h1 { color: var(--on-zone); font-size: clamp(32px, 5vw, 52px); }
.week-hero p { font-size: 19px; max-width: 680px; }
.week-hero .chip { background: var(--on-zone); color: var(--zc); }

.week-main { padding-block: 32px 56px; }

.col { display: flex; flex-direction: column; gap: 32px; min-width: 0; }

.play { width: 80px; height: 80px; border-radius: 50%; background: var(--zc); display: grid; place-items: center; }
.video + .note { margin-top: 10px; font-size: 15px; color: var(--muted); }
.block h2 { font-size: 28px; margin-bottom: 14px; }

.panel hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; width: 100%; }
.check { margin: 0; padding-left: 20px; font-size: 15.5px; }
.panel.tip { background: var(--soft); border-color: transparent; }
.footer { padding-block: 24px 40px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); }

.video.yt iframe { width: 100%; height: 100%; border: 0; display: block; }
a.video.linkcard { text-decoration: none; color: var(--bg); }
a.video.linkcard:hover { background: var(--ink); }
.video + .note a, .note a { font-weight: 800; color: var(--navy); }
.art { margin: 0; background: var(--soft); border-radius: 22px; padding: 12px; }
.art svg { width: 100%; height: auto; display: block; }
.art figcaption { padding: 8px 8px 4px; font-size: 15px; color: var(--muted); }

.quiz { background: var(--surface); border: 2px solid var(--zc); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.qhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.qstars { display: flex; flex-wrap: wrap; gap: 4px; }
.qstars svg { width: 26px; height: 26px; }
.quiz h2 { font-size: clamp(24px, 4vw, 32px); }
.quiz h2:focus { outline: none; }
.qopts { display: grid; gap: 12px; }
.qopt { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 12px 18px; border-radius: 18px; border: 2px solid var(--navy); background: var(--surface); color: var(--navy); font: 700 18px var(--body); text-align: left; cursor: pointer; }
.qopt:hover { background: var(--soft); }
.qopt .k { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-family: var(--display); font-weight: 600; flex: none; }
.qopt.good { border-color: var(--mueve); background: var(--soft); }
.qopt.good .k { background: var(--mueve); color: var(--on-zone); }
.qopt.miss { border-style: dashed; color: var(--muted); }
.qfb { min-height: 1.6em; font-weight: 700; color: var(--navy); font-size: 18px; }
.qbtn { align-self: flex-start; min-height: 48px; padding-inline: 24px; border-radius: 999px; border: 0; background: var(--navy); color: var(--bg); font: 800 17px var(--body); cursor: pointer; }
.qdone { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.qdone .qstars svg { width: 40px; height: 40px; }

@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 32px 16px; }
  .week-main .wrap { grid-template-columns: minmax(0, 1fr); }
  .badge { display: none; }
}
@media (max-width: 560px) {
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pg:last-child { text-align: left; }
  .nav a { padding-inline: 10px; }
  .play { width: 60px; height: 60px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

  '<g stroke="var(--muted)" stroke-width="1.5"><line x1="232" y1="40" x2="292" y2="40"/><line x1="268" y1="135" x2="292" y2="135"/><line x1="232" y1="190" x2="292" y2="190"/><line x1="108" y1="105" x2="152" y2="105"/></g>' +

}

function home(){
  var z0 = [1].map(weekCard).join('');
  var z1 = [2,3,4,5,6].map(weekCard).join('');
  var z2 = [7,8,9,10,11,12].map(weekCard).join('');
  var stamps = ORDER.map(function(n){ return '<li class="stamp"><i>'+n+'</i><span>'+W[n].short+'</span></li>'; }).join('');
  return '' +
  '<section class="wrap hero"><div><span class="chip">PERIODO 1 · GRADO 1°</span><h1>Mi cuerpo en movimiento</h1><p>En este periodo conozco mi cuerpo y practico los movimientos naturales: correr, saltar, lanzar, reptar y equilibrarme.</p><p class="ask">¿Cómo puedo reconocer mi cuerpo y moverme con seguridad para aprender y cuidar de mí?</p></div>' +
  '<figure class="body-art">'+figure()+'<figcaption>Doce semanas: empiezo con las normas, conozco mi cuerpo y aprendo a moverme.</figcaption></figure></section>' +
  '<section class="section" id="camino"><div class="wrap"><h2>El camino</h2><p class="lead">Cada semana tiene su tema. Toca una tarjeta para entrar.</p>' +
  '<div class="zone" style="--zc:var(--inicio)"><div class="zone-head"><span class="zone-tag">PARA EMPEZAR</span><h3>Bienvenida</h3></div><ol class="weeks">'+z0+'</ol></div>' +
  '<div class="zone" style="--zc:var(--cuerpo)"><div class="zone-head"><span class="zone-tag">ZONA 1</span><h3>Mi cuerpo</h3></div><ol class="weeks">'+z1+'</ol></div>' +
  '<div class="zone" style="--zc:var(--mueve)"><div class="zone-head"><span class="zone-tag">ZONA 2</span><h3>Me muevo</h3></div><ol class="weeks">'+z2+'</ol></div></div></section>' +
  '<section class="section" id="pasaporte"><div class="wrap"><div class="passport"><h2>Mi pasaporte de movimiento</h2><p class="lead" style="margin-top:8px">Un sello por cada semana que practico. Mi profe me lo da en clase.</p><ul class="stamps">'+stamps+'</ul><p class="note-small">Los sellos son un juego de la clase: aquí se ven vacíos hasta que el colegio los active en el campus virtual.</p></div></div></section>' +
  '<section class="section" id="familias"><div class="wrap"><h2>Para las familias</h2><p class="lead">Cómo acompañar a su estudiante en casa durante el periodo.</p><div class="families">' +
  '<div class="fam"><h3>Vean el video juntos</h3><p>Cada semana tiene un video corto. Mírenlo antes de practicar para saber qué se espera.</p></div>' +
  '<div class="fam"><h3>Jueguen sin presión</h3><p>Las ideas para casa son juegos de 10 a 15 minutos, en un espacio plano, seco y despejado, con un adulto cerca.</p></div>' +
  '<div class="fam"><h3>Celebren el intento</h3><p>Cada estudiante avanza a su ritmo. Aplaudan el esfuerzo, el cuidado y la forma de colaborar.</p></div>' +
  '</div></div></section>';
}

function pgLink(m, dir){
  return '<a class="pg" href="#s'+m+'"><span class="pg-dir">'+dir+'</span><span class="pg-title">Semana '+m+': '+W[m].short+'</span></a>';
}

function week(n){
  var d = W[n];
  var steps = d.steps.map(function(s,i){ return '<div class="card step"><span class="num">'+(i+1)+'</span><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>'; }).join('');
  var ideas = d.ideas.map(function(s){ return '<div class="card"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>'; }).join('');
  var cls = d.classes.map(function(c,i){ return (i?'<hr>':'') + '<div><div class="cl">'+c[0]+'</div><p>'+c[1]+'</p></div>'; }).join('');
  var check = CHECK.map(function(c){ return '<li>'+c+'</li>'; }).join('');
  var prev = n > 1 ? n-1 : 0, next = n < LAST ? n+1 : 0;
  var pg = (prev ? pgLink(prev,'Anterior') : '<span></span>') +
           (next ? pgLink(next,'Siguiente') : '<a class="pg" href="#pasaporte"><span class="pg-dir">Final del periodo</span><span class="pg-title">Ver mi pasaporte de movimiento</span></a>');
  return '<div style="--zc:var(--'+d.zone+')">' +
  '<section class="week-hero"><div class="wrap"><a class="crumb" href="#inicio" style="color:var(--on-zone)">← Volver al camino del periodo</a><span class="chip">SEMANA '+n+' · '+ZONE_NAME[d.zone]+'</span><h1>'+d.h1+'</h1><p>'+d.sub+'</p></div></section>' +
  '<section class="week-main"><div class="wrap"><div class="col">' +
  mediaBlock(n,d) +
  '<div class="block"><h2>'+d.stepsTitle+'</h2><div class="cards3">'+steps+'</div></div>' +
  '<div class="block"><div class="block-head"><h2>Practica en casa</h2><span class="chip">IDEAS PARA CASA</span></div><div class="cards3">'+ideas+'</div></div>' +
  '<div class="eval"><h2>¿Cómo me fue?</h2><p class="hint">Toca la opción que mejor te describe.</p><div class="opts" role="group" aria-label="¿Cómo me fue?"><button type="button" aria-pressed="false">Lo estoy intentando</button><button type="button" aria-pressed="false">Lo hago con ayuda</button><button type="button" aria-pressed="false">¡Lo domino!</button></div><p class="own">Es solo para ti: tu respuesta no se guarda.</p></div>' +
  '<nav class="pager" aria-label="Cambiar de semana">'+pg+'</nav></div>' +
  '<aside class="side" aria-label="Información de la semana"><div class="panel"><h2>Esta semana</h2>'+cls+'</div>' +
  '<div class="panel"><h2>Lo que mi profe observa</h2><div><div class="cl">COMPETENCIA</div><p>'+d.obs[0]+'</p></div><hr><div><div class="cl">ACTITUD</div><p>'+d.obs[1]+'</p></div></div>' +
  '<div class="panel"><h2>Antes de practicar</h2><ul class="check">'+check+'</ul><p>Al terminar: estiramiento e hidratación.</p></div>' +
  '<div class="panel"><h2>Materiales</h2><p><strong>En clase:</strong> '+d.matClase+'</p><p><strong>En casa:</strong> '+d.matCasa+'</p></div>' +
  '<div class="panel tip"><h2>Para las familias</h2><p>'+d.tip+'</p></div></aside></div></section></div>';
}


var STAR = '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/>';
function starsRow(score, total){
  var out = '';
  for (var i = 0; i < total; i++) {
    var on = i < score;
    out += '<svg viewBox="0 0 24 24" aria-hidden="true" fill="'+(on?'var(--gold)':'none')+'" stroke="'+(on?'var(--gold)':'var(--muted)')+'" stroke-width="1.6" stroke-linejoin="round">'+STAR+'</svg>';
  }
  return '<div class="qstars" role="img" aria-label="Estrellas ganadas: '+score+' de '+total+'">'+out+'</div>';
}
function startQuiz(){
  var box = document.getElementById('quiz');
  if (!box) return;
  var qs = QUIZ.qs, i = 0, score = 0, locked = false;
  function ask(){
    var q = qs[i]; locked = false;
    var opts = q.o.map(function(t,k){ return '<button type="button" class="qopt" data-k="'+k+'"><span class="k">'+'ABC'.charAt(k)+'</span><span>'+t+'</span></button>'; }).join('');
    box.innerHTML = '<div class="qhead"><span class="chip">PREGUNTA '+(i+1)+' DE '+qs.length+'</span>'+starsRow(score, qs.length)+'</div>' +
      '<h2 id="qtext" tabindex="-1">'+q.q+'</h2><div class="qopts" role="group" aria-labelledby="qtext">'+opts+'</div><p class="qfb" aria-live="polite"></p><div id="qnext"></div>';
    box.querySelector('#qtext').focus();
    box.querySelectorAll('.qopt').forEach(function(b){ b.addEventListener('click', function(){ pick(+b.getAttribute('data-k')); }); });
  }
  function pick(k){
    if (locked) return; locked = true;
    var q = qs[i], ok = (k === q.a);
    if (ok) score++;
    box.querySelectorAll('.qopt').forEach(function(b){
      var bk = +b.getAttribute('data-k');
      if (bk === q.a) b.classList.add('good'); else if (bk === k) b.classList.add('miss');
    });
    box.querySelector('.qfb').textContent = (ok ? '¡Muy bien! ' : 'Casi. La respuesta correcta es la marcada. ') + q.why;
    var last = (i === qs.length - 1);
    box.querySelector('#qnext').innerHTML = '<button type="button" class="qbtn" id="qgo">'+(last ? 'Ver mis estrellas' : 'Siguiente pregunta')+'</button>';
    var head = box.querySelector('.qstars'); if (head) head.outerHTML = starsRow(score, qs.length);
    document.getElementById('qgo').addEventListener('click', function(){ if (last) done(); else { i++; ask(); } });
    document.getElementById('qgo').focus();
  }
  function done(){
    var msg = score >= 7 ? '¡Lo dominas! Mostraste muy bien lo que aprendiste.' : score >= 5 ? '¡Muy bien! Vas por muy buen camino.' : 'Gracias por jugar. Sigue practicando y vuelve a intentarlo, ¡tú puedes!';
    box.innerHTML = '<div class="qdone"><span class="chip">FIN DEL QUIZ</span>'+starsRow(score, qs.length)+'<h2 id="qtext" tabindex="-1">Ganaste '+score+' de '+qs.length+' estrellas</h2><p>'+msg+'</p><button type="button" class="qbtn" id="qagain">Jugar otra vez</button><p class="note-small">Las estrellas no se guardan en esta página.</p></div>';
    box.querySelector('#qtext').focus();
    document.getElementById('qagain').addEventListener('click', function(){ i = 0; score = 0; ask(); });
  }
  ask();
}

function render(){
  var h = (location.hash || '').replace('#','');
  var view = document.getElementById('view');
  var m = /^s(\d+)$/.exec(h);
  if (m && W[+m[1]]) {
    view.innerHTML = week(+m[1]);
    var btns = view.querySelectorAll('.eval button');
    btns.forEach(function(b){
      b.addEventListener('click', function(){
        btns.forEach(function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
      });
    });
    startQuiz();
    window.scrollTo(0,0);
    document.title = 'Semana '+m[1]+' · '+W[+m[1]].short;
  } else {
    view.innerHTML = home();
    document.title = 'Mi cuerpo en movimiento';
    if (h === 'pasaporte' || h === 'familias' || h === 'camino') {
      var el = document.getElementById(h);
      if (el) el.scrollIntoView();
    } else { window.scrollTo(0,0); }
  }
}
window.addEventListener('hashchange', render);
render();
</script>
